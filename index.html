<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hit Rate Labs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hit Rate Labs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;height:100%;background:#0f1720;color:#e8eef5;font-family:-apple-system,system-ui,sans-serif}
#lk{display:flex;min-height:100%;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
form,#ld{width:100%;max-width:360px;text-align:center}
img{width:100%;height:auto;margin-bottom:14px;border-radius:12px}
input{width:100%;box-sizing:border-box;font-size:16px;padding:12px;margin:0 0 10px;border-radius:10px;border:1px solid #2a3846;background:#17212c;color:#e8eef5}
button{width:100%;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:10px;background:#34d399;color:#06281c}
button:disabled{opacity:.6}
#er{color:#f87171;font-size:14px;min-height:20px;margin-top:10px}
#ld{color:#9fb0c1;font-size:15px}
</style>
</head>
<body>
<div id="lk"><div id="ld" hidden><img src="logo.jpg" alt="">Loading...</div>
<form id="f" autocomplete="on" hidden><img src="logo.jpg" alt="">
<input id="u" name="email" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="Email" required>
<input id="p" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button id="b" type="submit">Sign in</button><div id="er"></div></form></div>
<script>
const SB="https://jdtqvgvyflgmmrgewjhu.supabase.co",KEY="sb_publishable_XKLBtZNgiff-5f5LzxQ_EA_u2iCRXGe",SK="hrl.session";
const H=(t)=>({apikey:KEY,...(t?{Authorization:"Bearer "+t}:{})});
async function tok(body,grant){
  const r=await fetch(SB+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token){const e=new Error(j.error_description||j.msg||j.error||"Sign in failed");e.status=r.status;throw e;}
  return j;
}
async function launch(sess){
  localStorage.setItem(SK,JSON.stringify({rt:sess.refresh_token}));
  const r=await fetch(SB+"/storage/v1/object/authenticated/app/app.html",{headers:H(sess.access_token),cache:"no-store"});
  if(!r.ok)throw new Error("Could not load the app ("+r.status+")");
  const html=await r.text();
  document.open();document.write(html);document.close();
}
const show=(id,on)=>{document.getElementById(id).hidden=!on};
async function boot(){
  if(location.search.indexOf("signout")>=0){try{localStorage.removeItem(SK)}catch(_){}history.replaceState(null,"",location.pathname);}
  let rt=null;try{rt=(JSON.parse(localStorage.getItem(SK)||"null")||{}).rt}catch(_){}
  if(rt){
    show("ld",true);
    try{await launch(await tok({refresh_token:rt},"refresh_token"));return;}
    catch(e){
      if(e.status&&e.status>=400&&e.status<500){try{localStorage.removeItem(SK)}catch(_){}}
      else{document.getElementById("ld").textContent="No connection. Check your internet and reload.";return;}
    }
    show("ld",false);
  }
  show("f",true);
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const er=document.getElementById("er"),b=document.getElementById("b");er.textContent="";b.disabled=true;b.textContent="Signing in...";
  try{await launch(await tok({email:document.getElementById("u").value.trim(),password:document.getElementById("p").value},"password"));}
  catch(x){er.textContent=(x.status===400||x.status===401)?"Wrong email or password.":(x.message||"Something went wrong.");b.disabled=false;b.textContent="Sign in";}
});
boot();
</script>
</body>
</html>
