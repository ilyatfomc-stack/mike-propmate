const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(IV)},key,d(CT));
  const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
async function derive(u,p){
  const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:d(SALT),iterations:ITER,hash:"SHA-256"},m,256));
}
const imp=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
(async()=>{
  try{const s=localStorage.getItem(LS);if(s){await open_(await imp(d(s)));return;}}catch(e){try{localStorage.removeItem(LS)}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const er=document.getElementById("er"),b=document.getElementById("b");er.textContent="";b.disabled=true;b.textContent="Checking...";
  try{
    const raw=await derive(document.getElementById("u").value,document.getElementById("p").value);
    const key=await imp(raw);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(IV)},key,d(CT));
    if(document.getElementById("k").checked){try{localStorage.setItem(LS,btoa(String.fromCharCode(...raw)))}catch(_){}}
    const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }catch(x){er.textContent="Wrong username or password.";b.disabled=false;b.textContent="Sign in";}
});
